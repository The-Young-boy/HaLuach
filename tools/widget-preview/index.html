<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<title>תצוגת ווידג'טים</title>
<!-- Dev aid (from HaFeed's tools/widget-preview): every widget card in every size, drawn with the Adaptive Cards
     renderer and Microsoft's widget host config. Sizes as measured on the board (epx): 260 wide; small 128,
     medium 265, large 402 tall, with the board's 48 px title row. The cards come from
     haluach-widget.exe --widgets (tools/widget-shots.mjs serves them as cards.json).
     ?zmanim,radio picks kinds; #dark for the dark host config. Validation problems are listed under each card. -->
<script src="https://unpkg.com/adaptivecards@3.0.4/dist/adaptivecards.min.js"></script>
<style>
  body { margin: 0; padding: 16px; background: #eef1f4; font-family: "Segoe UI", sans-serif; }
  body.dark { background: #1c1c1c; color: #fff; }
  h2 { font-size: 15px; margin: 18px 4px 8px; }
  .row { display: flex; gap: 16px; align-items: flex-start; flex-wrap: wrap; }
  .w { width: 260px; background: #fff; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,.12); overflow: hidden; display: flex; flex-direction: column; }
  .dark .w { background: #2b2b2b; }
  .w.small { height: 128px; } .w.medium { height: 265px; } .w.large { height: 402px; }
  .hd { height: 48px; flex: none; display: flex; align-items: center; gap: 8px; padding: 0 16px; font-size: 14px; }
  .hd i { width: 16px; height: 16px; border-radius: 4px; background: #c8902a; }
  .hd b { font-weight: 400; flex: 1; } .hd s { text-decoration: none; letter-spacing: 2px; }
  .body { flex: 1; overflow: hidden; padding: 0 16px 16px; }
  .body .ac-adaptiveCard { padding: 0 !important; }
  .lbl { font-size: 11px; color: #888; margin: 4px 2px 0; max-width: 260px; }
  .lbl.bad { color: #c42b1c; }
</style>
</head>
<body>
<div id="out"></div>
<script>
(async () => {
  const dark = location.hash === "#dark";
  document.body.classList.toggle("dark", dark);
  const host = new AdaptiveCards.HostConfig(await (await fetch("widget-" + (dark ? "dark" : "light") + ".json")).json());
  const cards = await (await fetch("cards.json", { cache: "no-store" })).json();
  const names = { zmanim: "זמני היום", shabbat: "שבת וחג", weather: "מזג אוויר", radio: "רדיו", rates: "שערי מטבע", transit: "תחבורה ציבורית",
    shipments: "משלוחים", podcasts: "פודקאסטים", learning: "לימוד יומי", personal: "תאריכים אישיים", calendar: "לוח שנה ושעון עולמי", forums: "פורומים", redalert: "צבע אדום" };
  const out = document.getElementById("out");
  const want = location.search.slice(1).split(",").filter(Boolean);
  const kinds = [...new Set(cards.map((c) => c.kind))].filter((k) => !want.length || want.includes(k));
  window.problems = [];
  for (const kind of kinds) {
    out.insertAdjacentHTML("beforeend", `<h2>${names[kind] || kind}</h2><div class="row" id="r-${kind}"></div>`);
    for (const c of cards.filter((x) => x.kind === kind)) {
      const card = new AdaptiveCards.AdaptiveCard();
      card.hostConfig = host;
      card.parse({ ...c.card, rtl: true });
      // The renderer's own check (unknown types and properties, bad values), plus the click targets Microsoft allows.
      const v = card.validateProperties();
      const bad = [];
      for (const e of v.validationEvents || []) bad.push(e.message);
      // Parse-time warnings (unknown element types or property values) are in the card's own events.
      for (const e of card.getAllWarnings?.() || []) bad.push(e.message);
      const json = JSON.stringify(c.card);
      const n = (json.match(/"selectAction"/g) || []).length + (c.card.actions || []).length;
      const max = { small: 1, medium: 3, large: 4 }[c.size];
      if (n > max) bad.push(`${n} click targets, at most ${max}`);
      const w = document.createElement("div");
      w.className = "w " + c.size;
      w.innerHTML = `<div class="hd"><i></i><b>${names[kind] || kind}</b><s>···</s></div><div class="body"></div>`;
      const el = card.render();
      w.querySelector(".body").append(el);
      const box = document.createElement("div");
      box.append(w);
      document.getElementById("r-" + kind).append(box);
      // Content taller than the widget: the board would cut it.
      const limit = w.querySelector(".body").getBoundingClientRect().bottom - 16;
      const over = Math.round(Math.max(0, ...[...el.querySelectorAll(".ac-textBlock, .ac-image, button")].map((e) => e.getBoundingClientRect().bottom)) - limit);
      if (over > 2) bad.push(`overflows by ${over}px`);
      box.insertAdjacentHTML("beforeend", `<div class="lbl${bad.length ? " bad" : ""}">${c.size}, ${n} targets${bad.length ? ": " + bad.join("; ") : ""}</div>`);
      if (bad.length) window.problems.push(`${kind}/${c.size}: ${bad.join("; ")}`);
    }
  }
  window.done = true;
})();
</script>
</body>
</html>
